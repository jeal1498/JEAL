<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartera · Conductor privado</title>
<meta name="description" content="Tu cartera de clientes privados: agenda, viajes, cobros y WhatsApp en un solo lugar.">
<meta name="theme-color" content="#f4f6f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #eaefec;
  --line: #dde3df;
  --text: #0d1210;
  --text-2: #4b5551;
  --muted: #76807b;
  --accent: #16a34a;
  --accent-ink: #ffffff;
  --accent-soft: #dcf5e4;
  --wa: #128c4a;
  --warn: #9a6700;
  --warn-bg: #fff4d6;
  --over: #c62828;
  --over-bg: #fde8e8;
  --map: #e4ece7; --road: #ffffff; --pin-a: #16a34a; --pin-b: #d0402b;
  --bubble: #d9fdd3; --bubble-ink: #0d1210;
  --radius: 14px;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 4px 16px rgb(0 0 0 / 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1110; --surface: #181c1a; --surface-2: #232926; --line: #2e3531;
    --text: #f4f7f5; --text-2: #bcc5c0; --muted: #8a948f;
    --accent: #22c55e; --accent-ink: #062b14; --accent-soft: #143322; --wa: #3ddc84;
    --warn: #e3b341; --warn-bg: #3a2f12; --over: #ff7b72; --over-bg: #3d1a1a; --shadow: none;
    --map: #1d2421; --road: #2c3531; --pin-a: #22c55e; --pin-b: #ff7b62;
    --bubble: #144d37; --bubble-ink: #e9f5ee;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1110; --surface: #181c1a; --surface-2: #232926; --line: #2e3531;
  --text: #f4f7f5; --text-2: #bcc5c0; --muted: #8a948f;
  --accent: #22c55e; --accent-ink: #062b14; --accent-soft: #143322; --wa: #3ddc84;
  --warn: #e3b341; --warn-bg: #3a2f12; --over: #ff7b72; --over-bg: #3d1a1a; --shadow: none;
    --map: #1d2421; --road: #2c3531; --pin-a: #22c55e; --pin-b: #ff7b62;
    --bubble: #144d37; --bubble-ink: #e9f5ee;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 9px 14px; font-weight: 600;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.wa, a.wa { color: var(--wa); }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Encabezado y pestañas */
.top {
  position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  padding: calc(8px + env(safe-area-inset-top)) 8px 8px; background: var(--bg);
}
.top h1 { font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: var(--text); background: none; border: 0; padding: 0; }
.brand { display: grid; place-items: center; width: 44px; height: 44px; color: var(--accent); }
.view { max-width: 640px; margin: 0 auto; padding: 4px 16px 88px; }
.tabs {
  position: fixed; inset: auto 0 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabs a { display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px 0; position: relative; }
.tabs a.on { color: var(--accent); }
.tabs a .dot { position: absolute; top: 0; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--over); color: #fff; font-size: 10px; line-height: 16px; padding: 0 4px; }
.fab {
  position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6;
  width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; padding: 0;
  background: var(--accent); border: 0; color: var(--accent-ink); box-shadow: 0 6px 20px rgb(0 0 0 / 0.2);
}
.fab .i { width: 26px; height: 26px; }

/* Bloques */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; box-shadow: var(--shadow); color: var(--text); display: grid; gap: 2px; min-width: 0; }
.tile small { color: var(--text-2); font-size: 12px; }
.tile b { font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { color: var(--muted); font-size: 12px; }
.tile.warn b { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card h3 { font-size: 15px; margin-bottom: 8px; }
.group { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; }
.group em { font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0; }
.empty { text-align: center; padding: 40px 16px; color: var(--text-2); display: grid; justify-items: center; gap: 10px; }
.empty > .i { width: 44px; height: 44px; color: var(--accent); }
.empty h2 { font-size: 19px; color: var(--text); }
.empty p { max-width: 360px; }
.muted { color: var(--muted); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--over-bg); color: var(--over); vertical-align: 1px; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--accent-soft); color: var(--accent); }

/* Viajes */
.trip { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; }
.trip.late { border-color: var(--warn); }
.trip.done { opacity: .75; }
.trip .when { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.trip .when small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); }
.trip .who { font-weight: 700; }
.trip .way { color: var(--text-2); font-size: 13px; }
.trip .price { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.trip .price small { display: block; font-weight: 600; font-size: 11px; }
.actions { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.actions button, .actions a { font-size: 13px; padding: 7px 11px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-weight: 600; }
.actions .i { width: 16px; height: 16px; }

/* Listas */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.list li:first-child { border-top: 0; }
.list .body { flex: 1; min-width: 0; display: grid; }
.list .body small { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; flex: none; }
.search { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; scrollbar-width: none; }
.chips button { flex: none; max-width: 85%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Ficha del cliente */
.hero { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 8px 0 14px; }
.hero .avatar { width: 64px; height: 64px; font-size: 24px; }
.hero h2 { font-size: 21px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.quick a, .quick button { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--text); }
.quick .i { color: var(--accent); }
.quick .wa .i { color: var(--wa); }
.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; white-space: pre-line; }

/* Resumen */
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 14px; }
.bar i { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--accent); border-radius: 4px; }
.monthnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.monthnav b { font-size: 16px; }

/* Hoja de formulario */
.sheet { border: 0; padding: 0; width: 100%; max-width: 640px; margin: auto auto 0; border-radius: 20px 20px 0 0; background: var(--surface); color: var(--text); max-height: 92vh; }
.sheet::backdrop { background: rgb(0 0 0 / 0.4); }
.sheet form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { grid-column: 1 / -1; font-size: 18px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); font-weight: 600; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; font-weight: 400; color: var(--text); }
.field small { font-weight: 400; color: var(--muted); }
.check { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.seg { grid-column: 1 / -1; display: grid; grid-auto-flow: column; gap: 6px; }
.seg label { position: relative; text-align: center; padding: 9px 4px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--accent-ink); }
.seg label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.buttons { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.buttons .left { margin-right: auto; color: var(--over); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.toast.on { opacity: 1; }

/* Servicios frecuentes y punto A → B */
.sheet form > .wide { grid-column: 1 / -1; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
.sec small { color: var(--muted); font-size: 12px; }
.svcs { display: grid; gap: 10px; }
.svcs:empty { display: none; }
.svc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.svc-head { display: flex; gap: 8px; align-items: center; padding: 10px 12px 0; }
.svc-head input { flex: 1; min-width: 0; border: 0; background: none; font-weight: 700; font-size: 15px; padding: 4px 0; color: var(--text); }
.svc-head button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px; }
.route { position: relative; display: grid; gap: 8px; padding: 10px 12px; }
.sheet form > .route { padding: 0; }
.route::before { content: ""; position: absolute; left: 25px; top: 30px; bottom: 30px; border-left: 2px dotted var(--muted); }
.sheet form > .route::before { left: 13px; }
.stop { position: relative; display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 4px; }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-left: 7px; background: var(--pin-a); box-shadow: 0 0 0 3px var(--accent-soft); }
.dot.b { background: var(--pin-b); border-radius: 3px; box-shadow: none; }
.stop input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; color: var(--text); }
.sugg { position: absolute; z-index: 3; left: 32px; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); overflow: hidden; }
.sugg button { display: grid; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; padding: 9px 12px; font-weight: 600; }
.sugg button:first-child { border-top: 0; }
.sugg button:hover, .sugg button:focus-visible { background: var(--surface-2); }
.sugg small { color: var(--muted); font-size: 12px; font-weight: 400; }
.sugg .g { font-size: 11px; color: var(--muted); padding: 6px 12px; text-align: right; }
.map { display: block; width: 100%; height: 120px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1.2fr; border-top: 1px solid var(--line); }
.stats div { padding: 9px 12px; display: grid; gap: 1px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats small { font-size: 11.5px; color: var(--muted); }
.stats b { font-size: 17px; font-variant-numeric: tabular-nums; }
.stats .price b { color: var(--accent); }
.how { margin: 0 12px 12px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
#troute .how { margin-top: 10px; }
.empty-route { padding: 14px 12px; text-align: center; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
.price-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 0 12px 12px; }
.price-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
.price-row input { width: 96px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.add { border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 14px; padding: 12px; font-weight: 700; }
.qs { display: grid; gap: 8px; }
.q { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.q small { color: var(--text-2); font-size: 12.5px; grid-column: 1; }
.q .meta { grid-column: 1; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.q .amt { font-weight: 800; color: var(--text); }
.q button { grid-column: 2; grid-row: 1 / span 3; background: var(--accent); color: var(--accent-ink); border: 0; }
.tarifa { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tarifa legend { font-weight: 700; font-size: 14px; padding: 0 4px; }
.tarifa legend small { font-weight: 400; color: var(--muted); }
.tarifa > small { grid-column: 1 / -1; }

/* Perfil e inicio rápido */
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.brand.me { width: 36px; height: 36px; margin: 4px; border-radius: 50%; background: var(--accent-soft); font-weight: 800; font-size: 14px; }
.brand.me .i { width: 18px; height: 18px; }
body.onboarding { padding-bottom: 0; }
body.onboarding .tabs, body.onboarding .top { display: none; }
.ob { min-height: 100dvh; display: flex; flex-direction: column; gap: 14px; padding: calc(20px + env(safe-area-inset-top)) 2px calc(16px + env(safe-area-inset-bottom)); }
.ob .pstep { flex: 1; }
.welcome { flex: 1; display: grid; align-content: start; gap: 18px; padding-top: 24px; }
.welcome h2, .pstep h2, .done h2 { font-size: 24px; line-height: 1.15; text-wrap: balance; }
.mark { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mark .i { width: 36px; height: 36px; }
.benefits { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.benefits li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; }
.benefits .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.benefits b { display: block; }
.benefits span { color: var(--text-2); font-size: 13.5px; }
.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress i { height: 4px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--accent); }
.steplabel { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pstep { display: grid; gap: 12px; align-content: start; }
.pbody { display: grid; gap: 12px; }
.pbody > .muted { margin: 0; }
.pstep .field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 400; color: var(--text); }
.sheet .pstep .field input { background: var(--bg); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: inline-flex; align-items: center; justify-self: start; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.stepper button { border: 0; border-radius: 0; background: none; width: 44px; height: 42px; font-size: 20px; color: var(--accent); padding: 0; }
.stepper b { min-width: 34px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 8px; }
.nav button { flex: 1; border-radius: 12px; padding: 13px; }
.nav .primary { flex: 2; }
.cta { width: 100%; border-radius: 12px; padding: 13px; }
.cta.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.skip { border: 0; background: none; color: var(--muted); align-self: center; font-size: 13.5px; }
.done { flex: 1; display: grid; justify-items: center; align-content: start; text-align: center; gap: 12px; padding-top: 40px; }
.done .mark { border-radius: 50%; }
.more { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; }
.more summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
.more summary small { color: var(--muted); font-weight: 400; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.sw { display: flex; gap: 10px; align-items: center; min-width: 0; font-weight: 600; font-size: 14px; }
.sw input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.sw small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.unit { display: flex; align-items: center; gap: 4px; flex: none; color: var(--muted); font-size: 13px; }
.unit input { width: 72px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 15px; font-weight: 700; text-align: right; color: var(--text); }
.example { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.example small { color: var(--muted); font-size: 12px; }
.example .big { font-size: 28px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.calc { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 4px 0 0; font-size: 13px; font-variant-numeric: tabular-nums; }
.calc dt { color: var(--text-2); }
.calc dd { margin: 0; text-align: right; font-weight: 600; }
.calc .off { color: var(--muted); text-decoration: line-through; font-weight: 400; }

.copy { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.copy code { font: 600 13.5px ui-monospace, "SF Mono", Menlo, monospace; user-select: all; overflow-wrap: anywhere; }

.carrow { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }

.kv2 dd { margin: 0; font-weight: 700; text-align: right; }
.share { display: flex; justify-content: center; align-items: center; gap: 8px; border-radius: 12px; padding: 13px; font-weight: 700; background: var(--accent); color: var(--accent-ink); margin-bottom: 12px; }

/* v1.3: menos pasos */
.sheet small.field:empty { display: none; }

.opts { grid-column: 1 / -1; }

.opts summary small { color: var(--muted); font-weight: 400; }
.opts > div { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 10px; }
.opts .wide { grid-column: 1 / -1; }
.stop.has-loc { grid-template-columns: 28px 1fr 40px; }
.stop .loc { border: 0; background: none; color: var(--accent); padding: 8px; }
.svc-head b { flex: 1; min-width: 0; font-size: 15px; padding: 4px 0; }
.paygrid { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.paygrid button.hab { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.paygrid button.debt { grid-column: 1 / -1; color: var(--over); }

/* v1.4: semana completa y cobro a tu ritmo */

.pick { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

.pick span { flex: 1; min-width: 0; display: grid; }

.total { grid-column: 1 / -1; margin: 0; font-weight: 800; font-size: 16px; }
.nudge { border-color: var(--accent); display: grid; gap: 2px; }
.nudge .actions { margin-top: 10px; }

.qrbox { display: grid; justify-items: center; gap: 6px; }

.ghost { color: var(--accent); font-weight: 700; font-size: 14px; text-align: center; text-decoration: none; }
.sheet .plain { width: 100%; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
.rrow { display: grid; grid-template-columns: 1fr 88px 36px; gap: 6px; margin-bottom: 6px; }
.rrow button { padding: 0; border-radius: 10px; }

</style>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

// Nombre corto y legible a partir del resultado de Nominatim.
function labelOf(r) {
  const a = r.address || {};
  const name = r.name || [a.road, a.house_number].filter(Boolean).join(' ') || r.display_name.split(',')[0];
  const area = a.suburb || a.neighbourhood || a.quarter || a.road || '';
  const city = a.city || a.town || a.village || a.county || '';
  return { label: [name, area && area !== name ? area : ''].filter(Boolean).join(', '), sub: [city, a.state].filter(Boolean).join(', ') };

function searchPlaces(q, near) {
  const p = new URLSearchParams({ q, format: 'jsonv2', addressdetails: '1', limit: '5', 'accept-language': 'es', countrycodes: 'mx' });
  if (near) {
    const d = 0.6;
    p.set('viewbox', [near.lon - d, near.lat + d, near.lon + d, near.lat - d].join(','));
  }
  return cached('s:' + p, async () => {
    const res = await fetch('https://nominatim.openstreetmap.org/search?' + p);
    if (!res.ok) throw new Error('search');
    return (await res.json()).map((r) => ({ ...labelOf(r), lat: +r.lat, lon: +r.lon }));

function reverse(lat, lon) {
  return cached(`v:${lat.toFixed(4)},${lon.toFixed(4)}`, async () => {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=jsonv2&addressdetails=1&accept-language=es`);
    if (!res.ok) throw new Error('reverse');
    const r = await res.json();
    if (!r || r.error) throw new Error('reverse');
    return { ...labelOf(r), lat, lon };
  });

function route(a, b) {
  const k = `r:${a.lon.toFixed(5)},${a.lat.toFixed(5)};${b.lon.toFixed(5)},${b.lat.toFixed(5)}`;
  return cached(k, async () => {
    const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${k.slice(2)}?overview=simplified&geometries=geojson`);
    const d = await res.json();
    if (d.code !== 'Ok' || !d.routes?.length) throw new Error('route');
    const r = d.routes[0];

    return { km: Math.round(r.distance / 100) / 10, min: Math.max(1, Math.round((r.duration / 60) * 1.25)), path: r.geometry.coordinates };

const numOr = (v, d) => (v === '' || v == null || isNaN(+v) ? d : +v);
const EXTRAS_INFO = [
  ['base', 'Banderazo', '$', 'Se suma a cada viaje'],
  ['minimum', 'Viaje mínimo', '$', 'Ningún viaje cuesta menos'],
  ['airport', 'Extra aeropuerto', '$', 'Si el viaje sale o llega al aeropuerto'],
  ['night', 'Tarifa nocturna', '%', 'De 10 pm a 6 am'],
  ['wait', 'Tiempo de espera', '$/min', 'Lo agregas en el viaje si te hacen esperar'],
];
const PRESETS = { 'Económica': [9, 150], 'Estándar': [12, 180], 'Ejecutiva': [16, 250] };
const isAirport = (...labels) => labels.some((l) => /aeropuerto|airport/i.test(l || ''));
const isNight = (time) => !!time && (+time.slice(0, 2) >= 22 || +time.slice(0, 2) < 6);
function quote(km, min, { airport = false, night = false, wait = 0 } = {}, s = data.settings) {
  const X = s.extra || EXTRA_DEF, lines = [];
  const byKm = km * numOr(s.perKm, 12), byHour = (min / 60) * numOr(s.perHour, 180);
  let p = Math.max(byKm, byHour);
  lines.push([`Por km · ${km} km × $${s.perKm}`, byKm, byKm >= byHour], [`Por hora · ${min} min a $${s.perHour}/h`, byHour, byHour > byKm]);
  if (X.base.on) { p += +X.base.v; lines.push(['Banderazo', +X.base.v, true]); }
  if (X.airport.on && airport) { p += +X.airport.v; lines.push(['Extra aeropuerto', +X.airport.v, true]); }
  if (X.wait.on && wait) { p += wait * X.wait.v; lines.push([`Espera · ${wait} min`, wait * X.wait.v, true]); }
  if (X.night.on && night) { const n = (p * X.night.v) / 100; p += n; lines.push([`Nocturna +${X.night.v}%`, n, true]); }
  let total = Math.round(p / 10) * 10;
  if (X.minimum.on && total < +X.minimum.v) { total = +X.minimum.v; lines.push(['Sube al viaje mínimo', total, true]); }
  return { total, lines };
}

function sleeping(c) {
  const last = lastTrip(c.id);
  return daysBetween(last ? last.date : new Date(c.createdAt).toLocaleDateString('en-CA'), today()) > 30;
}
function drawClientList() {
  const q = fold(clientQuery).split(/\s+/).filter(Boolean);
  const list = data.clients
    .filter((c) => q.every((w) => fold([c.name, c.phone, c.places, c.notes, ...(c.services || []).map((sv) => `${sv.name} ${sv.a?.label} ${sv.b?.label}`)].join(' ')).includes(w)))
    .filter((c) => (clientFilter === 'debe' ? debtOf(c.id) > 0 : clientFilter === 'dormidos' ? sleeping(c) : true))
    .map((c) => ({ c, last: lastTrip(c.id), n: tripsOf(c.id).filter((t) => t.status === 'hecho').length, debt: debtOf(c.id) }))
    .sort((a, b) => (b.last?.date || '').localeCompare(a.last?.date || '') || a.c.name.localeCompare(b.c.name, 'es'));
  $('#clist').innerHTML = list.length ? list.map(({ c, last, n, debt }) => `<li data-client="${c.id}" tabindex="0">
      <span class="avatar">${esc(initials(c.name))}</span>

    const go = () => (location.hash = `#/cliente/${li.dataset.client}`);

}

function pickBackup() {
  const file = document.createElement('input');
  file.type = 'file';
  file.accept = 'application/json,.json';
  file.onchange = async () => {
    try {
      const d = JSON.parse(await file.files[0].text());
      if (d.app !== 'cartera') throw new Error();
      // Suma sin borrar: lo que trae el archivo reemplaza solo los mismos ids.
      for (const k of ['clients', 'trips']) {
        const m = new Map(data[k].map((x) => [x.id, x]));
        for (const x of d[k] || []) m.set(x.id, x);
        data[k] = [...m.values()];
      }
      if (d.settings) data.settings = { ...data.settings, ...d.settings, onboarded: true };
      save();
      data = load();
      refresh();
      toast('Copia cargada');
    } catch { toast('Ese archivo no es una copia de Cartera'); }
  };
  file.click();
}
// Contactos del teléfono (Chrome en Android).
async function importContacts() {
  try {
    const list = await navigator.contacts.select(['name', 'tel'], { multiple: true });
    let n = 0;
    for (const c of list) {
      const name = (c.name?.[0] || '').trim();
      const phone = (c.tel?.[0] || '').trim();
      if (!name || data.clients.some((x) => x.name === name || (phone && x.phone.replace(/\D/g, '').slice(-10) === phone.replace(/\D/g, '').slice(-10)))) continue;
      data.clients.push({ id: uid(), name, phone, notes: '', services: [], createdAt: Date.now(), updatedAt: Date.now() });
      n++;
    }
    data.settings.onboarded = true;
    location.hash = '#/clientes';
    refresh();
    toast(n ? `${n} cliente${n === 1 ? '' : 's'} agregado${n === 1 ? '' : 's'}` : 'No se agregó nadie nuevo');
  } catch { toast('No se pudieron leer los contactos'); }
}

}
// Conecta los campos de un paso con el borrador D; redraw vuelve a pintar el paso.
function wireStep(root, D, redraw) {
  root.oninput = (e) => {
    const el = e.target;
    if (el.dataset.x) D.extra[el.dataset.x].v = +el.value || 0;
    else if (el.dataset.k) {
      D[el.dataset.k] = el.type === 'number' ? numOr(el.value, 0) : el.value;
      if (el.dataset.k === 'perKm' || el.dataset.k === 'perHour') root.querySelectorAll('[data-toggle=preset]').forEach((b) => b.setAttribute('aria-pressed', PRESETS[b.dataset.v].join() === [D.perKm, D.perHour].join()));
      if (el.dataset.k === 'clabe' || el.dataset.k === 'bank' || el.dataset.k === 'driver') liveStep(root, D);
    }
    liveStep(root, D);
  };
  root.onchange = (e) => { if (e.target.dataset.on) { D.extra[e.target.dataset.on] = { ...D.extra[e.target.dataset.on], on: e.target.checked }; redraw(); } };
  root.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t || !root.contains(t)) return;
    if (t.dataset.seats) { D.seats = Math.min(15, Math.max(1, D.seats + +t.dataset.seats)); redraw(); }
    else if (t.dataset.toggle === 'preset') { [D.perKm, D.perHour] = PRESETS[t.dataset.v]; redraw(); }
    else if (t.dataset.toggle) {
      const list = D[t.dataset.toggle], v = t.dataset.v;
      list.includes(v) ? list.splice(list.indexOf(v), 1) : list.push(v);
      redraw();
    }
  });
  liveStep(root, D);
}

const PAYS = [['', 'Me debe'], ['efectivo', 'Efectivo'], ['transferencia', 'Transferencia'], ['tarjeta', 'Tarjeta']];
const seg = (name, opts, val) => `<div class="seg" role="radiogroup">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${v === val ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;

// ---------- Punto A y punto B ----------
// Lugares ya usados (servicios y viajes) aparecen primero, sin internet.
function knownPlaces(clientId) {
  const out = new Map();
  const add = (p) => { if (p?.label && p.lat != null && !out.has(p.label)) out.set(p.label, p); };
  const cs = clientId ? [client(clientId)] : data.clients;
  cs.forEach((c) => (c?.services || []).forEach((sv) => { add(sv.a); add(sv.b); }));
  data.trips.filter((t) => !clientId || t.clientId === clientId).forEach((t) => { add(t.fromPt); add(t.toPt); });
  if (clientId) knownPlaces().forEach((p) => add(p));
  return [...out.values()];
}
const nearPoint = () => knownPlaces()[0] || null;
const autoName = (sv) => [sv.a?.label, sv.b?.label].map((l) => (l || '…').split(',')[0]).join(' → ');
const svcCtx = (sv) => ({ airport: isAirport(sv.a?.label, sv.b?.label) });
const svcPrice = (sv) => sv.price ?? (sv.km ? suggestPrice(sv.km, sv.min, svcCtx(sv)) : 0);
const fromService = (c, sv) => ({ clientId: c.id, from: sv.a?.label || '', to: sv.b?.label || '', fromPt: sv.a, toPt: sv.b, km: sv.km || '', min: sv.min || '', path: sv.path, price: svcPrice(sv) });

function placeInput(pt, which, placeholder, locate = false) {
  return `<div class="stop ${locate ? 'has-loc' : ''}"><span class="dot ${which}"></span><input data-pt="${which}" value="${esc(pt?.label || '')}" placeholder="${placeholder}" autocomplete="off" enterkeyhint="search">${locate ? `<button type="button" class="loc" data-loc aria-label="Usar mi ubicación">${icon('pin')}</button>` : ''}</div>`;
}
// Origen habitual del cliente: el que más usa; si no hay viajes, el de su primer servicio.
function usualFrom(id) {
  const c = client(id);
  if (!c) return null;
  const n = new Map();
  tripsOf(id).filter((x) => x.status !== 'cancelado' && x.fromPt?.label).sort(byWhen).forEach((x) => {
    const e = n.get(x.fromPt.label) || { p: x.fromPt, n: 0 };
    e.n++; e.p = x.fromPt; n.set(x.fromPt.label, e);
  });
  const best = [...n.values()].sort((a, b) => b.n - a.n)[0];
  return best?.p || (c.services || []).find((sv) => sv.a)?.a || null;
}
// Sugerencias al escribir; al elegir una, guarda el punto con sus coordenadas.
function wirePlace(input, clientId, onPick) {
  let timer, box;
  const close = () => { box?.remove(); box = null; };
  const show = (items, note) => {
    close();
    if (!items.length && !note) return;
    box = document.createElement('div');
    box.className = 'sugg';
    box.innerHTML = items.map((p, i) => `<button type="button" data-i="${i}"><span>${esc(p.label)}</span><small>${esc(p.sub || 'Usado antes')}</small></button>`).join('') + (note ? `<div class="g">${note}</div>` : '');
    box.onpointerdown = (e) => e.preventDefault();
    box.onclick = (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      const p = items[+b.dataset.i];
      input.value = p.label;
      close();
      onPick({ label: p.label, lat: p.lat, lon: p.lon });
    };
    input.parentElement.append(box);
  };
  input.addEventListener('input', () => {
    onPick(null, true);
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) return close();
    const words = fold(q).split(/\s+/);
    const local = knownPlaces(typeof clientId === 'function' ? clientId() : clientId).filter((p) => words.every((w) => fold(p.label + ' ' + (p.sub || '')).includes(w))).slice(0, 3);
    show(local, q.length >= 3 ? 'Buscando en el mapa…' : '');
    if (q.length < 3) return;
    timer = setTimeout(async () => {
      try {
        const found = (await searchPlaces(q, nearPoint())).filter((r) => !local.some((l) => l.label === r.label));
        if (input.value.trim() !== q || document.activeElement !== input) return;
        show([...local, ...found].slice(0, 6), found.length ? 'Mapa: OpenStreetMap' : 'Sin resultados en el mapa. Agrega colonia o ciudad.');
      } catch {
        if (input.value.trim() === q) show(local, 'Sin conexión: puedes escribir la dirección y el precio a mano.');
      }
    }, 650);
  });
  input.addEventListener('blur', () => setTimeout(close, 150));
}
// Distancia, tiempo, mapa y precio sugerido de A a B.
async function fillRoute(el, a, b) {
  if (!a || !b) { el.innerHTML = '<div class="empty-route">Elige el punto A y el punto B de la lista para ver distancia, tiempo y precio.</div>'; return null; }
  el.innerHTML = '<div class="empty-route">Calculando ruta…</div>';
  try {
    const r = await route(a, b);
    el.innerHTML = `${mapSvg(r.path, `Ruta de ${esc(a.label)} a ${esc(b.label)}`)}
      <div class="stats"><div><small>Distancia</small><b>${r.km} km</b></div><div><small>Tiempo</small><b>${r.min} min</b></div><div class="price"><small>Sugerido</small><b>${money(suggestPrice(r.km, r.min, { airport: isAirport(a.label, b.label) }))}</b></div></div>
      <div class="how">${priceMath(r.km, r.min, { airport: isAirport(a.label, b.label) })} · <a href="${directionsLink(a, b)}" target="_blank" rel="noopener">Ver en Google Maps</a></div>`;
    return r;
  } catch {
    el.innerHTML = '<div class="empty-route">No se pudo calcular la ruta (¿sin internet?). Pon el precio a mano.</div>';
    return null;
  }
}

function serviceCard(sv, onRemove, getClient) {
  const el = document.createElement('section');
  el.className = 'svc';
  el.innerHTML = `<div class="svc-head"><b data-title>${esc(sv.name || 'Servicio nuevo')}</b><button type="button" data-rm>Quitar</button></div>
    <div class="route">${placeInput(sv.a, 'a', 'Punto A · ¿de dónde sale?')}${placeInput(sv.b, 'b', 'Punto B · ¿a dónde va?')}</div>
    <div data-route></div>
    <div class="price-row"><label><span>Tu precio $</span><input data-price type="number" inputmode="numeric" min="0" step="10" value="${sv.price ?? ''}" placeholder="${sv.km ? suggestPrice(sv.km, sv.min, svcCtx(sv)) : ''}"></label><small class="muted">vacío = sugerido</small></div>`;
  const titleEl = $('[data-title]', el);
  let auto = sv.name && sv.name === autoName(sv) ? sv.name : '';
  const priceIn = $('[data-price]', el);
  const routeEl = $('[data-route]', el);
  const update = async () => {
    const r = await fillRoute(routeEl, sv.a, sv.b);
    Object.assign(sv, r ? { km: r.km, min: r.min, path: r.path } : { km: '', min: '', path: null });
    priceIn.placeholder = r ? suggestPrice(r.km, r.min, svcCtx(sv)) : '';
    if (sv.a && sv.b && (!sv.name || sv.name === auto)) { sv.name = auto = autoName(sv); titleEl.textContent = sv.name; }
  };
  for (const which of ['a', 'b']) {
    wirePlace($(`[data-pt=${which}]`, el), getClient()?.id, (p, typing) => {
      sv[which] = p;
      if (!typing || !p) update();
    });
  }
  priceIn.oninput = () => { sv.price = priceIn.value === '' ? null : +priceIn.value; };
  $('[data-rm]', el).onclick = onRemove;
  if (sv.a && sv.b) {
    // Ya calculada: dibuja sin volver a pedir la ruta.
    if (sv.path) routeEl.innerHTML = `${mapSvg(sv.path)}<div class="stats"><div><small>Distancia</small><b>${sv.km} km</b></div><div><small>Tiempo</small><b>${sv.min} min</b></div><div class="price"><small>Sugerido</small><b>${money(suggestPrice(sv.km, sv.min, svcCtx(sv)))}</b></div></div><div class="how">${priceMath(sv.km, sv.min, svcCtx(sv))} · <a href="${directionsLink(sv.a, sv.b)}" target="_blank" rel="noopener">Ver en Google Maps</a></div>`;
    else update();
  } else fillRoute(routeEl, sv.a, sv.b);
  return el;
}

// Atajos de fecha y hora (Ahora · Hoy · Mañana).
const whenHtml = '<div class="chips wide" data-when><button type="button" data-w="now">Ahora</button><button type="button" data-w="0">Hoy</button><button type="button" data-w="1">Mañana</button></div>';
function wireWhen(form, onChange = () => {}) {
  const d = form.elements.date, tm = form.elements.time;
  const mark = () => form.querySelectorAll('[data-w]').forEach((b) => b.classList.toggle('on', (b.dataset.w === '0' && d.value === today()) || (b.dataset.w === '1' && d.value === addDays(today(), 1))));
  form.querySelectorAll('[data-w]').forEach((b) => (b.onclick = () => {
    if (b.dataset.w === 'now') { d.value = today(); tm.value = new Date().toTimeString().slice(0, 5); }
    else d.value = addDays(today(), +b.dataset.w);
    mark(); onChange();
  }));
  d.addEventListener('input', () => { mark(); onChange(); });
  mark();
}
const lastUse = (id) => Math.max(0, ...tripsOf(id).map((t) => t.updatedAt || t.createdAt || 0));

// Después de guardar un viaje: ofrece confirmarlo por WhatsApp o guardar la ruta repetida.
function tripToast(x, isNew) {
  const c = client(x.clientId);
  const learn = x.status === 'hecho' ? learnOffer(x) : null;
  if (learn) return toast('Guardado · ruta repetida', learn);
  if (isNew && x.status === 'agendado' && c?.phone) return toast('Viaje agendado', { label: 'Confirmar por WhatsApp', fn: () => window.open(waLink(c, MSG.confirm(c, x)), '_blank', 'noopener') });
  toast(isNew ? 'Viaje agendado' : 'Guardado');
}
// A la segunda vez que haces la misma ruta con un cliente, ofrece guardarla como servicio frecuente.
function learnOffer(t) {
  const c = client(t.clientId);
  if (!c || !t.fromPt?.label || !t.toPt?.label || t.status !== 'hecho') return null;
  c.services ||= [];
  if (c.services.some((sv) => sv.a?.label === t.fromPt.label && sv.b?.label === t.toPt.label)) return null;
  const n = tripsOf(c.id).filter((x) => x.status === 'hecho' && x.fromPt?.label === t.fromPt.label && x.toPt?.label === t.toPt.label).length;
  if (n !== 2) return null;
  return { label: 'Guardar ruta frecuente', fn: () => {
    const sv = { id: uid(), a: t.fromPt, b: t.toPt, km: t.km || '', min: t.min || '', path: t.path || null, price: +t.price || null };
    sv.name = autoName(sv);
    c.services.push(sv);
    c.updatedAt = Date.now();
    refresh();
    toast(`Ruta guardada en ${firstName(c)}`);
  } };
}

// Agendar en un paso: ya sabemos cliente, ruta y precio; solo falta cuándo.
function quickTrip(preset, title) {
  const c = client(preset.clientId);
  if (!c || !+preset.price) return tripForm(null, preset);
  const way = preset.from || preset.to ? `${preset.from || '…'} → ${preset.to || '…'}` : '';
  openSheet(`<h2>${esc(title)}</h2>
    <p class="field wide" style="font-weight:400">${esc(c.name)}${way ? ' · ' + esc(way) : ''} · <b>${money(preset.price)}</b></p>
    ${field('Fecha', `<input name="date" type="date" required value="${today()}">`)}
    ${field('Hora', `<input name="time" type="time" value="${esc(preset.time)}">`)}
    ${whenHtml}
    <div class="buttons"><button type="button" data-close>Cancelar</button><button type="button" data-more>Más opciones</button><button class="primary">Agendar</button></div>`, (form) => {
    $('[data-close]', form).onclick = () => sheet.close();
    wireWhen(form);
    const read = () => ({ ...preset, date: form.elements.date.value || today(), time: form.elements.time.value || '' });
    $('[data-more]', form).onclick = () => { const p = read(); sheet.close(); tripForm(null, p); };
    form.onsubmit = () => {
      const x = { id: uid(), createdAt: Date.now(), updatedAt: Date.now(), status: 'agendado', pay: '', notes: '', wait: '', ...read() };
      data.trips.push(x);
      sheet.close();
      refresh();
      tripToast(x, true);
    };
  });
}

function tripForm(t = null, preset = {}) {
  const v = { date: today(), status: 'agendado', pay: '', ...preset, ...(t || {}) };
  if (!v.clientId && data.clients.length === 1) v.clientId = data.clients[0].id;
  openSheet(`<h2>${t ? 'Editar viaje' : 'Nuevo viaje'}</h2>
    <div class="field wide">Cliente<div class="chips wrap" id="cchips"></div>${data.clients.length > 5 ? '<input data-cq type="search" placeholder="Buscar otro cliente" autocomplete="off" aria-label="Buscar cliente">' : ''}</div>
    <input type="hidden" name="clientId" value="${esc(v.clientId)}">
    ${field('Fecha', `<input name="date" type="date" required value="${esc(v.date)}">`)}
    ${field('Hora', `<input name="time" type="time" value="${esc(v.time)}">`)}
    ${whenHtml}
    <div class="chips wide" id="svcchips"></div>
    <div class="route wide">${placeInput(v.fromPt || (v.from ? { label: v.from } : null), 'a', 'Punto A · origen', true)}${placeInput(v.toPt || (v.to ? { label: v.to } : null), 'b', 'Punto B · destino')}</div>
    <small class="field wide muted" id="pnote"></small>
    <div class="wide svc" id="troute" hidden></div>
    ${field('Precio', `<input name="price" type="number" inputmode="decimal" step="1" min="0" required value="${esc(v.price)}">`, true)}
    <small class="field wide muted" id="hint"></small>
    <details class="opts" ${t ? 'open' : ''}><summary>Más opciones <small>km, espera, estado, notas</small></summary><div>
      ${field('Km', `<input name="km" type="number" inputmode="decimal" step="0.1" min="0" value="${esc(v.km)}">`)}
      ${data.settings.extra?.wait?.on ? field('Espera (min)', `<input name="wait" type="number" inputmode="numeric" min="0" step="5" value="${esc(v.wait)}">`) : ''}
      <span class="field wide">Estado</span>${seg('status', [['agendado', 'Agendado'], ['hecho', 'Hecho'], ['cancelado', 'Cancelado']], v.status)}
      <div class="wide" id="paybox" style="grid-column:1/-1;display:grid;gap:6px"><span class="field">Pago</span>${seg('pay', PAYS, v.pay || '')}</div>
      ${field('Notas', `<textarea name="notes" rows="2">${esc(v.notes)}</textarea>`, true)}
    </div></details>
    ${buttons(!!t)}`, (form) => {
    wireCommon(form, () => { data.trips = data.trips.filter((x) => x.id !== t.id); });
    const els = form.elements;
    const idIn = els.clientId;
    const hint = $('#hint', form);
    const paybox = $('#paybox', form);
    let priceTyped = !!t;
    els.price.addEventListener('input', () => { priceTyped = true; });
    const fromIn = $('[data-pt=a]', form);
    const toIn = $('[data-pt=b]', form);
    const rt = { fromPt: v.fromPt || null, toPt: v.toPt || null, min: v.min || '', path: v.path || null };
    const routeEl = $('#troute', form);
    const suggest = () => {
      const same = data.trips.filter((x) => x.clientId === idIn.value && x.id !== t?.id && x.status !== 'cancelado' && x.from === fromIn.value.trim() && x.to === toIn.value.trim() && (x.from || x.to)).sort(byWhen).pop();
      const km = +els.km.value;
      const min = +rt.min || Math.round(km * 2);
      const ctx = { airport: isAirport(fromIn.value, toIn.value), night: isNight(els.time.value), wait: +(els.wait?.value || 0) };
      const tips = [];
      if (same) tips.push(`La última vez: ${money(same.price)}`);
      if (km) tips.push(`Con tu tarifa: ${money(suggestPrice(km, min, ctx))} (${priceMath(km, min, ctx)})`);
      hint.textContent = tips.join(' · ');
      if (!priceTyped && (same || km)) els.price.value = same ? same.price : suggestPrice(km, min, ctx);
    };
    const checkPlaces = () => {
      const bad = (fromIn.value.trim() && !rt.fromPt) || (toIn.value.trim() && !rt.toPt);
      $('#pnote', form).textContent = bad ? 'Toca una opción de la lista para calcular ruta y precio, o escribe el precio a mano.' : '';
    };
    [fromIn, toIn].forEach((i) => i.addEventListener('blur', () => setTimeout(checkPlaces, 300)));
    const recalc = async () => {
      routeEl.hidden = !(rt.fromPt && rt.toPt);
      if (routeEl.hidden) { rt.min = ''; rt.path = null; return; }
      const r = await fillRoute(routeEl, rt.fromPt, rt.toPt);
      if (r) { els.km.value = r.km; rt.min = r.min; rt.path = r.path; suggest(); }
    };
    const cid = () => idIn.value;
    wirePlace(fromIn, cid, (p, typing) => { rt.fromPt = p; if (!typing || !p) { recalc(); suggest(); checkPlaces(); } });
    wirePlace(toIn, cid, (p, typing) => { rt.toPt = p; if (!typing || !p) { recalc(); suggest(); checkPlaces(); } });
    if (rt.fromPt && rt.toPt) {
      routeEl.hidden = false;
      if (rt.path) routeEl.innerHTML = `${mapSvg(rt.path)}<div class="how">${els.km.value} km · ${rt.min} min · <a href="${directionsLink(rt.fromPt, rt.toPt)}" target="_blank" rel="noopener">Ver en Google Maps</a></div>`;
      else recalc();
    }
    // Origen: el habitual del cliente, mientras no lo cambies a mano.
    let autoFrom = '';
    const prefillFrom = () => {
      if (t || (fromIn.value.trim() && fromIn.value !== autoFrom)) return;
      const p = usualFrom(idIn.value);
      if (!p) return;
      fromIn.value = autoFrom = p.label;
      rt.fromPt = p.lat != null ? { label: p.label, lat: p.lat, lon: p.lon } : null;
      recalc(); suggest();
    };
    // Mi ubicación como punto A.
    $('[data-loc]', form).onclick = () => {
      if (!navigator.geolocation) return toast('Tu teléfono no comparte la ubicación');
      toast('Buscando tu ubicación…');
      navigator.geolocation.getCurrentPosition(async ({ coords: { latitude: lat, longitude: lon } }) => {
        let p;
        try { const r = await reverse(lat, lon); p = { label: r.label, lat, lon }; } catch { p = { label: 'Mi ubicación', lat, lon }; }
        fromIn.value = p.label; autoFrom = ''; rt.fromPt = p;
        recalc(); suggest(); checkPlaces();
      }, () => toast('No se pudo obtener tu ubicación'), { enableHighAccuracy: true, timeout: 10000 });
    };
    // Servicios frecuentes del cliente: un toque llena A, B y precio.
    const fillPlaces = () => {
      const svs = client(idIn.value)?.services || [];
      const chips = $('#svcchips', form);
      chips.innerHTML = svs.map((sv) => `<button type="button" data-sv="${sv.id}">${esc(sv.name || autoName(sv))}</button>`).join('');
      chips.hidden = !svs.length;
      chips.querySelectorAll('[data-sv]').forEach((b) => (b.onclick = () => {
        const sv = svs.find((x) => x.id === b.dataset.sv);
        const f = fromService(client(idIn.value), sv);
        fromIn.value = f.from; toIn.value = f.to; autoFrom = '';
        Object.assign(rt, { fromPt: f.fromPt, toPt: f.toPt, min: f.min, path: f.path });
        els.km.value = f.km; els.price.value = f.price; priceTyped = true;
        chips.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
        routeEl.hidden = !(f.fromPt && f.toPt);
        if (f.path) routeEl.innerHTML = `${mapSvg(f.path)}<div class="how">${f.km} km · ${f.min} min · <a href="${directionsLink(f.fromPt, f.toPt)}" target="_blank" rel="noopener">Ver en Google Maps</a></div>`;
        hint.textContent = `Servicio frecuente: ${money(f.price)}`;
        checkPlaces();
      }));
    };
    // Cliente: los más recientes a un toque; con muchos clientes, buscador.
    const cchips = $('#cchips', form);
    const cq = $('[data-cq]', form);
    const drawClients = () => {
      const q = fold(cq?.value || '').trim();
      let list = q
        ? data.clients.filter((c) => fold(c.name + ' ' + (c.phone || '')).includes(q)).slice(0, 8)
        : [...data.clients].sort((a, b) => lastUse(b.id) - lastUse(a.id) || a.name.localeCompare(b.name, 'es')).slice(0, 5);
      const cur = client(idIn.value);
      if (cur && !q && !list.includes(cur)) list = [cur, ...list];
      cchips.innerHTML = list.map((c) => `<button type="button" data-c="${c.id}" class="${c.id === idIn.value ? 'on' : ''}">${esc(c.name)}</button>`).join('') + '<button type="button" data-newc>＋ Nuevo</button>';
    };
    const setClient = (id) => {
      idIn.value = id;
      if (cq) cq.value = '';
      drawClients(); fillPlaces(); prefillFrom(); suggest();
    };
    cchips.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.newc) clientForm(null, { onSaved: (c) => tripForm(null, { ...readForm(), clientId: c.id }) });
      else setClient(b.dataset.c);
    };
    cq?.addEventListener('input', drawClients);
    const showPay = () => { paybox.hidden = form.querySelector('[name=status]:checked').value !== 'hecho'; };
    form.querySelectorAll('[name=status]').forEach((r) => (r.onchange = showPay));
    els.km.addEventListener('input', () => { rt.min = ''; suggest(); });
    els.time.addEventListener('input', suggest);
    els.wait?.addEventListener('input', suggest);
    wireWhen(form, suggest);
    drawClients(); fillPlaces(); prefillFrom(); suggest(); showPay();
    function readForm() {
      const f = new FormData(form);
      return {
        clientId: f.get('clientId'), date: f.get('date'), time: f.get('time') || '',
        from: fromIn.value.trim(), to: toIn.value.trim(), fromPt: rt.fromPt, toPt: rt.toPt, km: f.get('km'), min: rt.min, path: rt.path, wait: f.get('wait') || '',
        price: +f.get('price') || 0,
        status: f.get('status'), pay: f.get('status') === 'hecho' ? f.get('pay') || '' : '', notes: f.get('notes').trim(),
      };
    }
    form.onsubmit = (e) => {
      const x = { ...(t || { id: uid(), createdAt: Date.now() }), ...readForm(), updatedAt: Date.now() };
      if (!client(x.clientId)) { e.preventDefault(); toast('Elige un cliente'); return; }
      if (t) Object.assign(t, x);
      else data.trips.push(x);
      sheet.close();
      refresh();
      tripToast(x, !t);
    };
  });
  // Sin clientes: primero se crea uno y luego se agenda su viaje.
  if (!data.clients.length) { sheet.close(); clientForm(null, { onSaved: (c) => tripForm(null, { ...preset, clientId: c.id }) }); }
}

// ---------- Cobro en un toque ----------
const PAY_LABEL = { efectivo: 'Efectivo', transferencia: 'Transferencia', tarjeta: 'Tarjeta' };
// Botones de forma de pago; la habitual del cliente va primero.
function payGrid(c, { debt = false } = {}) {
  const order = Object.keys(PAY_LABEL);
  const hab = c?.lastPay && PAY_LABEL[c.lastPay] ? c.lastPay : '';
  if (hab) { order.splice(order.indexOf(hab), 1); order.unshift(hab); }
  return `<div class="paygrid">${order.map((k) => `<button type="button" data-pay="${k}" class="${k === hab ? 'hab' : ''}">${PAY_LABEL[k]}${k === hab ? '<small>habitual</small>' : ''}</button>`).join('')}${debt ? '<button type="button" data-pay="" class="debt">Me debe</button>' : ''}</div>`;
}

// Terminar un viaje: un toque en cómo te pagó y listo.
function finishForm(t) {
  const c = client(t.clientId);
  openSheet(`<h2>Terminar viaje</h2>
    <p class="field wide" style="font-weight:400">${esc(c?.name)} · ${money(t.price)}</p>
    <span class="field wide">¿Cómo te pagó? <small>un toque y listo</small></span>${payGrid(c, { debt: true })}
    <div class="buttons"><button type="button" data-close>Cancelar</button></div>`, (form) => {
    $('[data-close]', form).onclick = () => sheet.close();
    form.querySelectorAll('[data-pay]').forEach((b) => (b.onclick = () => {
      const pay = b.dataset.pay;
      Object.assign(t, { status: 'hecho', pay, updatedAt: Date.now() });
      if (pay && c) c.lastPay = pay;
      sheet.close();
      refresh();
      const offer = learnOffer(t);
      toast(offer ? 'Viaje terminado · ruta repetida' : pay ? 'Viaje terminado' : 'Anotado en Cobros', offer);
    }));
  });
}
function payForm(list) {
  const total = list.reduce((s, t) => s + +t.price, 0);
  const c = client(list[0].clientId);
  openSheet(`<h2>Registrar pago</h2>
    <p class="field wide" style="font-weight:400">${esc(c?.name)} · ${list.length} viaje${list.length === 1 ? '' : 's'} · ${money(total)}</p>
    ${payGrid(c)}
    <div class="buttons"><button type="button" data-close>Cancelar</button></div>`, (form) => {
    $('[data-close]', form).onclick = () => sheet.close();
    form.querySelectorAll('[data-pay]').forEach((b) => (b.onclick = () => {
      const pay = b.dataset.pay;
      for (const t of list) Object.assign(t, { pay, paidAt: today(), updatedAt: Date.now() });
      if (c) c.lastPay = pay;
      sheet.close();
      refresh();
      toast('Cobrado');
    }));
  });
}
