<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1110" media="(prefers-color-scheme: dark)">
<title>Conductor privado</title>
<style>
:root { color-scheme: light dark; --bg: #f4f6f5; --surface: #fff; --text: #0f1512; --muted: #5d6b64; --line: #dfe6e2; --accent: #16a34a; --accent-ink: #fff; --soft: #e3f5ea; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1110; --surface: #171b19; --text: #eef3f0; --muted: #9aa8a1; --line: #27302c; --accent: #22c55e; --accent-ink: #04210f; --soft: #14301f; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 12px; }
.hero { text-align: center; display: grid; gap: 4px; justify-items: center; padding: 8px 0 4px; }
.avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--soft); color: var(--accent); border: 3px solid var(--accent); display: grid; place-items: center; font-size: 38px; font-weight: 800; }
h1 { margin: 8px 0 0; font-size: 26px; line-height: 1.15; }
.muted { color: var(--muted); }
.btns { display: grid; gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 17px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.card h2 { margin: 0; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags i { font-style: normal; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--accent); font-weight: 600; }
.bank { display: grid; gap: 2px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--line); }
.bank small { color: var(--muted); font-size: 12px; }
.bank .clabe { font: 700 19px/1.3 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .02em; user-select: all; overflow-wrap: anywhere; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
footer { text-align: center; font-size: 12px; color: var(--muted); padding-top: 8px; }
</style>
</head>
<body>
<main id="app"><p class="muted" style="text-align:center">Cargando…</p></main>
<script>
(() => {
  const app = document.getElementById('app');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const str = (v, n = 80) => (typeof v === 'string' ? v.slice(0, n) : '');
  const digits = (v) => String(v ?? '').replace(/\D/g, '');
  const money = (n) => '$' + Math.round(+n || 0).toLocaleString('es-MX');
  const fail = (msg) => { app.replaceChildren(el('p', 'muted', msg)); app.firstChild.style.textAlign = 'center'; };

  function b64uToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  async function decode(h) {
    const kind = h[0];
    let bytes = b64uToBytes(h.slice(1));
    if (kind === 'z') {
      if (!('DecompressionStream' in window)) throw new Error('old');
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    } else if (kind !== 'j') throw new Error('bad');
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  async function copy(text, btn, label) {
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
    btn.textContent = '¡Copiado!';
    setTimeout(() => (btn.textContent = label), 1600);
  }
  const groupClabe = (d) => (d.length === 18 ? `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6, 17)} ${d.slice(17)}` : d.replace(/(\d{4})(?=\d)/g, '$1 '));
  const vcardEsc = (s) => String(s).replace(/[\\;,]/g, (c) => '\\' + c).replace(/\r?\n/g, ' ');

  async function main() {
    const h = location.hash.slice(1);
    if (!h) return fail('Este enlace no tiene datos. Pídele a tu conductor que te comparta su código QR otra vez.');
    let d;
    try { d = await decode(h); } catch (e) {
      return fail(e.message === 'old' ? 'Tu navegador es muy antiguo para abrir esta página. Actualízalo o ábrela en Chrome.' : 'No pude leer este enlace. Pídele a tu conductor que te lo comparta otra vez.');
    }
    const name = str(d.n, 60) || 'Conductor';
    const city = str(d.c, 40);
    const w = digits(d.w);
    const first = name.split(/\s+/)[0];
    document.title = `${name} · Conductor privado`;
    const frag = document.createDocumentFragment();

    const hero = el('section', 'hero');
    hero.append(el('div', 'avatar', (name[0] || '?').toUpperCase()), el('h1', '', name), el('span', 'muted', 'Conductor privado' + (city ? ' · ' + city : '')));
    frag.append(hero);

    if (/^\d{8,15}$/.test(w)) {
      const btns = el('div', 'btns');
      const wa = el('a', 'btn primary', 'Pedir viaje por WhatsApp');
      wa.href = `https://wa.me/${w}?text=${encodeURIComponent(`Hola ${first}, quiero pedir un viaje.`)}`;
      wa.target = '_blank'; wa.rel = 'noopener';
      const call = el('a', 'btn', 'Llamar');
      call.href = `tel:+${w}`;
      btns.append(wa, call);
      frag.append(btns);
    }

    if (Array.isArray(d.a) && d.a[0]) {
      const c = el('section', 'card');
      c.append(el('h2', '', 'Mi auto'));
      const [car, year, color, seats, extras] = d.a;
      c.append(el('b', '', `${str(car, 40)} ${str(String(year ?? ''), 4)}`.trim()));
      const meta = [str(color, 24), +seats ? `${+seats} pasajeros` : ''].filter(Boolean).join(' · ');
      if (meta) c.append(el('span', 'muted', meta));
      if (Array.isArray(extras) && extras.length) { const t = el('div', 'tags'); extras.slice(0, 10).forEach((x) => t.append(el('i', '', str(x, 30)))); c.append(t); }
      frag.append(c);
    }

    if (Array.isArray(d.r) && d.r.length) {
      const c = el('section', 'card');
      c.append(el('h2', '', 'Precios de referencia'));
      d.r.slice(0, 10).forEach((r) => { if (!Array.isArray(r)) return; const row = el('div', 'row'); row.append(el('span', '', str(r[0], 60)), el('b', '', money(r[1]))); c.append(row); });
      c.append(el('p', 'note', 'Son precios de referencia. Confirma tu viaje por WhatsApp.'));
      frag.append(c);
    }

    if (d.h) { const c = el('section', 'card'); c.append(el('h2', '', 'Horario'), el('span', '', str(d.h, 80))); frag.append(c); }

    const pays = Array.isArray(d.p) ? d.p.slice(0, 6).map((x) => str(x, 20)).filter(Boolean) : [];
    const clabe = Array.isArray(d.b) ? digits(d.b[2]) : '';
    if (pays.length || clabe) {
      const c = el('section', 'card');
      c.append(el('h2', '', 'Formas de pago'));
      if (pays.length) { const t = el('div', 'tags'); pays.forEach((x) => t.append(el('i', '', x))); c.append(t); }
      if (/^\d{10,22}$/.test(clabe)) {
        const box = el('div', 'bank');
        const bank = str(d.b[0], 40), holder = str(d.b[1], 80);
        if (bank) { box.append(el('small', '', 'Banco'), el('b', '', bank)); }
        if (holder) { box.append(el('small', '', 'A nombre de'), el('b', '', holder)); }
        box.append(el('small', '', clabe.length === 18 ? 'CLABE' : 'Cuenta o tarjeta'), el('span', 'clabe', groupClabe(clabe)));
        const btn = el('button', 'btn', 'Copiar CLABE');
        btn.type = 'button';
        if (clabe.length !== 18) btn.textContent = 'Copiar número';
        const label = btn.textContent;
        btn.onclick = () => copy(clabe, btn, label);
        c.append(box, btn);
      }
      frag.append(c);
    }

    const save = el('button', 'btn', 'Guardar mi contacto');
    save.type = 'button';
    save.onclick = () => {
      const v = ['BEGIN:VCARD', 'VERSION:3.0', `FN:${vcardEsc(name)}`, w ? `TEL;TYPE=CELL:+${w}` : '', `NOTE:${vcardEsc('Conductor privado' + (city ? ' en ' + city : ''))}`, 'END:VCARD'].filter(Boolean).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([v], { type: 'text/vcard' }));
      a.download = 'contacto.vcf';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    if (w) frag.append(save);
    frag.append(el('footer', '', 'Página hecha con Cartera'));
    app.replaceChildren(frag);
  }
  main();
  addEventListener('hashchange', () => location.reload());
})();
</script>
</body>
</html>
