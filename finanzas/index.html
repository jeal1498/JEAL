<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Finanzas · SecondBrain</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon.svg">
<script>
/* Aplica el tema antes de pintar para evitar el parpadeo. */
(function () {
  try {
    var t = localStorage.getItem('finanzas_theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = t === 'dark' ? '#0d1311' : '#eef0ed';
  } catch (e) {}
})();
</script>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-title">
      <a class="icon-btn" href="../#/proyectos" aria-label="Volver a Proyectos">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div>
        <h1>Finanzas</h1>
        <p id="header-sub"></p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="search-toggle" data-action="search-toggle" aria-label="Buscar" aria-expanded="false">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button type="button" class="icon-btn" data-action="theme" aria-label="Cambiar tema">
        <svg class="ic i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ic i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
  <div class="search" id="search-bar" hidden>
    <input type="search" id="search" placeholder="Buscar concepto o categoría" autocomplete="off" aria-label="Buscar concepto o categoría">
  </div>

  <section class="hero" aria-label="Resumen">
    <div class="hero-period" id="hero-period">
      <button type="button" class="hp-label" id="month-label" data-action="month-picker" aria-haspopup="dialog">
        <span id="month-text"></span>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div class="hero-top">
      <p class="hero-label" id="s-label"></p>
      <span class="badge" id="s-badge"></span>
    </div>
    <p class="hero-amount" id="s-amount">$0</p>
    <p class="hero-note" id="s-note"></p>

    <div class="rhythm" id="rhythm" role="img" aria-label="Distribución de los pagos por día">
      <p class="rhythm-cap" id="rhythm-cap"></p>
      <div class="cols" id="cols"></div>
      <div class="axis" id="axis"></div>
      <div class="rhythm-foot" id="rhythm-foot"></div>
    </div>
    <div class="meter" id="s-meter" hidden><span></span></div>

    <div class="hero-stats">
      <div class="stat" id="stat-1">
        <span class="stat-label"></span><span class="stat-value"></span><span class="stat-sub"></span>
      </div>
      <button type="button" class="stat" id="stat-2" data-action="go-urgency">
        <span class="stat-label"></span><span class="stat-value"></span><span class="stat-sub"></span>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </section>

  <section class="controls" aria-label="Filtros">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
  </section>

  <div class="list-head">
    <div class="list-title"><span id="list-caption"></span><span id="list-count"></span></div>
    <div class="seg" id="seg" role="group" aria-label="Agrupar por">
      <button type="button" id="g-urg" data-action="group" data-group="urgencia" aria-pressed="true" aria-label="Agrupar por urgencia" title="Por urgencia">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button type="button" id="g-cat" data-action="group" data-group="categoria" aria-pressed="false" aria-label="Agrupar por categoría" title="Por categoría">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </div>
  <div id="list"></div>
  </main>
</div>

<nav class="bottom-nav" aria-label="Secciones">
  <div class="bottom-nav-inner">
    <button type="button" class="nav-btn" data-action="view" data-view="gastos" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      Gastos
    </button>
    <button type="button" class="nav-add" data-action="add" aria-label="Agregar">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="metas" aria-current="false">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Metas
    </button>
  </div>
</nav>

<div class="sheet-backdrop" id="sheet" data-action="backdrop" hidden>
  <div class="sheet" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Cerrar">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
